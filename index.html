<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div class="score">分数: <span id="score">0</span></div>
            <div class="lives">生命: <span id="lives">3</span></div>
            <div class="progress">Boss进度: <span id="progress">0/5</span></div>
        </div>
        <div id="startScreen" class="screen">
            <h1>飞机游戏</h1>
            <p>使用方向键或WASD移动</p>
            <p>按空格键发射子弹</p>
            <p>手机端：滑动屏幕移动，点击射击按钮发射</p>
            <button id="startBtn">开始游戏</button>
        </div>
        <div id="gameOverScreen" class="screen hidden">
            <h1>游戏结束</h1>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
        <div id="touchControls" class="touch-controls">
            <div class="touch-move-area" id="touchMoveArea">
                <div class="touch-joystick">
                    <div class="touch-joystick-handle" id="joystickHandle"></div>
                </div>
            </div>
            <div class="touch-shoot-area">
                <button class="touch-shoot-btn" id="touchShootBtn">射击</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/background.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
