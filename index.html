<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞机游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="orientationWarning" class="orientation-warning">
        <div class="orientation-content">
            <div class="rotate-icon">↻</div>
            <h2>请旋转设备</h2>
            <p>此游戏需要横屏模式才能获得最佳体验</p>
        </div>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div class="score">分数: <span id="score">0</span></div>
            <div class="lives">生命: <span id="lives">3</span></div>
            <div class="progress">Boss进度: <span id="progress">0/5</span></div>
        </div>
        <div id="startScreen" class="screen">
            <h1>飞机游戏</h1>
            <p>使用方向键或WASD移动</p>
            <p>按空格键发射子弹</p>
            <p>手机端：滑动屏幕移动，点击射击按钮发射</p>
            <button id="startBtn">开始游戏</button>
        </div>
        <div id="gameOverScreen" class="screen hidden">
            <h1>游戏结束</h1>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
        <div id="touchControls" class="touch-controls">
            <div class="touch-move-area" id="touchMoveArea">
                <div class="touch-joystick">
                    <div class="touch-joystick-handle" id="joystickHandle"></div>
                </div>
            </div>
            <div class="touch-shoot-area">
                <button class="touch-shoot-btn" id="touchShootBtn">射击</button>
            </div>
        </div>
    </div>

    <script>
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let isPortraitMode = false;

        function calculateScale() {
            const gameWidth = 1280;
            const gameHeight = 720;
            
            if (isMobile) {
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                
                console.log('屏幕尺寸:', screenWidth, 'x', screenHeight);
                console.log('游戏尺寸:', gameWidth, 'x', gameHeight);
                
                const scaleX = screenWidth / gameWidth;
                const scaleY = screenHeight / gameHeight;
                const scale = Math.min(scaleX, scaleY) * 0.95;
                
                console.log('缩放比例:', scale, '计算: scaleX, scaleY');
                console.log('缩放计算:', scaleX, scaleY);
                return scale;
            } else {
                return 1;
            }
        }

        function checkOrientation() {
            const orientationWarning = document.getElementById('orientationWarning');
            const gameContainer = document.querySelector('.game-container');
            const touchControls = document.getElementById('touchControls');
            
            if (isMobile && window.innerHeight > window.innerWidth) {
                isPortraitMode = true;
                orientationWarning.style.display = 'none';
                gameContainer.style.display = 'block';
                const scale = calculateScale();
                gameContainer.style.transform = `scale(${scale}) rotate(90deg)`;
                gameContainer.style.transformOrigin = 'center center';
                if (touchControls) {
                    touchControls.style.display = 'flex';
                }
            } else if (isMobile && window.innerHeight <= window.innerWidth) {
                isPortraitMode = false;
                orientationWarning.style.display = 'none';
                gameContainer.style.display = 'block';
                const scale = calculateScale();
                gameContainer.style.transform = `scale(${scale})`;
                gameContainer.style.transformOrigin = 'center center';
                if (touchControls) {
                    touchControls.style.display = 'flex';
                }
            } else {
                isPortraitMode = false;
                if (window.innerHeight > window.innerWidth) {
                    orientationWarning.style.display = 'flex';
                    gameContainer.style.display = 'none';
                } else {
                    orientationWarning.style.display = 'none';
                    gameContainer.style.display = 'block';
                    gameContainer.style.transform = 'scale(1)';
                }
                if (touchControls) {
                    touchControls.style.display = 'none';
                }
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(checkOrientation, 100);
            setTimeout(checkOrientation, 500);
        });
        
        window.addEventListener('load', checkOrientation);
        
        setInterval(checkOrientation, 1000);
    </script>

    <script src="js/utils.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/background.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
